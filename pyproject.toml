[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hack-usf"
version = "0.1.0"
description = "Elderly monitoring system with CV pipeline"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
cv = [
    "fastapi>=0.115.0",
    "python-multipart>=0.0.9",
    "uvicorn[standard]>=0.32.0",
    "ultralytics>=8.3.0",
    "mediapipe>=0.10.14",
    "opencv-python-headless>=4.10.0",
    "httpx>=0.27.0",
    "pydantic>=2.0",
    "numpy>=1.26.0",
    "torchreid",
]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21.0",
]

[tool.setuptools.packages.find]
include = ["cv*", "capture*"]
